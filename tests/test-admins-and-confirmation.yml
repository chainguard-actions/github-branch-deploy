name: Test branch-deploy admins and deployment confirmation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issue_comment
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          trigger: ".deploy"
          environment: "production"
          permissions: "write,admin"
          admins: "monalisa,octocat"
          deployment_confirmation: "false"
          deployment_confirmation_timeout: "60"
          successful_deploy_labels: "deployed,success"
          successful_noop_labels: "noop,success"
          failed_deploy_labels: "failed,deploy-failed"
          failed_noop_labels: "failed,noop-failed"
          skip_successful_noop_labels_if_approved: "false"
          skip_successful_deploy_labels_if_approved: "false"
        continue-on-error: true

      - name: Assert admins and confirmation options accepted gracefully
        env:
          TRIGGERED: ${{ steps.action.outputs.triggered }}
          ACTOR: ${{ steps.action.outputs.actor }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "triggered: $TRIGGERED"
          echo "actor: $ACTOR"
          echo "outcome: $OUTCOME"
          # The action should accept admins and confirmation options.
          # Without a real GitHub context, it may error gracefully.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with triggered=$TRIGGERED"
          else
            echo "PASS: action exited with expected error (no real GitHub context in act)"
          fi
