name: Test branch-deploy not triggered
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issue_comment
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock event payload (no trigger comment)
        run: |
          mkdir -p /tmp/github-events
          cat > /tmp/github-events/event.json <<'EOF'
          {
            "action": "created",
            "issue": {
              "number": 1,
              "pull_request": {
                "url": "https://api.github.com/repos/test-owner/test-repo/pulls/1"
              }
            },
            "comment": {
              "id": 123456,
              "body": "This is just a regular comment, no deploy trigger here",
              "user": {
                "login": "testuser"
              }
            },
            "repository": {
              "name": "test-repo",
              "owner": {
                "login": "test-owner"
              },
              "default_branch": "main"
            },
            "sender": {
              "login": "testuser"
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/github-events/event.json" >> $GITHUB_ENV

      - id: branch-deploy
        uses: .
        with:
          github_token: ${{ github.token }}
          trigger: ".deploy"
          environment: "production"
          permissions: "write,admin"
        continue-on-error: true

      - name: Assert triggered is false or action handled gracefully
        env:
          TRIGGERED: ${{ steps.branch-deploy.outputs.triggered }}
          OUTCOME: ${{ steps.branch-deploy.outcome }}
        run: |
          echo "triggered: $TRIGGERED"
          echo "outcome: $OUTCOME"
          # The action should either succeed with triggered=false,
          # or fail gracefully (e.g., due to missing GitHub API context in act)
          # We accept either "false" or empty for triggered when no trigger comment is present
          if [ "$TRIGGERED" = "true" ]; then
            echo "FAIL: expected triggered to be false or empty, got 'true'"
            exit 1
          fi
          echo "PASS: action handled non-trigger comment correctly (triggered=$TRIGGERED)"
