name: Test unlock-on-merge-mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run branch-deploy action in unlock_on_merge_mode
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          unlock_on_merge_mode: "true"
          environment: "production"
          environment_targets: "production,development,staging"
          permissions: "write,admin"

      - name: Assert unlock_on_merge_mode ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          UNLOCKED: ${{ steps.action.outputs.unlocked_environments }}
          DECISION: ${{ steps.action.outputs.decision }}
          REASON_CODE: ${{ steps.action.outputs.reason_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "unlocked_environments: $UNLOCKED"
          echo "decision: $DECISION"
          echo "reason_code: $REASON_CODE"
          if [ "$OUTCOME" = "success" ]; then
            # Under workflow_dispatch (not a pull_request closed+merged event),
            # unlock_on_merge returns false immediately without making API calls.
            # The action still succeeds with decision='complete' and reason_code='unlock_on_merge_completed'.
            # unlocked_environments will be empty (no locks to release).
            if [ "$DECISION" != "complete" ]; then
              echo "FAIL: expected decision='complete' but got '$DECISION'"
              exit 1
            fi
            if [ "$REASON_CODE" != "unlock_on_merge_completed" ]; then
              echo "FAIL: expected reason_code='unlock_on_merge_completed' but got '$REASON_CODE'"
              exit 1
            fi
            echo "PASS: unlock_on_merge_mode succeeded with decision=$DECISION (unlocked_environments='$UNLOCKED')"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable for unlock_on_merge_mode)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
