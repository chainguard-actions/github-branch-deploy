name: Test basic usage - no trigger detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run branch-deploy action
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          trigger: ".deploy"
          environment: "production"
          permissions: "write,admin"
        continue-on-error: true

      - name: Assert triggered is false or action handled gracefully
        env:
          TRIGGERED: ${{ steps.action.outputs.triggered }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "triggered: $TRIGGERED"
          echo "outcome: $OUTCOME"
          # Under workflow_dispatch with no issue comment context, the action
          # should either set triggered=false or exit gracefully.
          # Both outcomes are acceptable - the action should not crash unexpectedly.
          if [ "$TRIGGERED" = "true" ]; then
            echo "FAIL: triggered should not be 'true' under workflow_dispatch with no comment"
            exit 1
          fi
          echo "PASS: action handled no-trigger scenario correctly (triggered=$TRIGGERED)"
