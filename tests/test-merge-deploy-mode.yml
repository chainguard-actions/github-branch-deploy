name: Test merge_deploy_mode option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run branch-deploy action in merge_deploy_mode
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          merge_deploy_mode: "true"
          environment: "production"
          permissions: "write,admin"
        continue-on-error: true

      - name: Assert action ran without unexpected crash
        env:
          TRIGGERED: ${{ steps.action.outputs.triggered }}
          CONTINUE: ${{ steps.action.outputs.continue }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "triggered: $TRIGGERED"
          echo "continue: $CONTINUE"
          echo "outcome: $OUTCOME"
          # In merge_deploy_mode under workflow_dispatch (not a push event on merge),
          # the action should handle the scenario gracefully.
          # triggered should not be 'true' since there's no matching event.
          if [ "$TRIGGERED" = "true" ]; then
            echo "FAIL: triggered should not be 'true' in merge_deploy_mode under workflow_dispatch"
            exit 1
          fi
          echo "PASS: merge_deploy_mode handled gracefully (triggered=$TRIGGERED, continue=$CONTINUE)"
