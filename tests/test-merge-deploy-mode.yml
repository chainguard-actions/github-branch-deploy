name: Test merge-deploy-mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run branch-deploy action in merge_deploy_mode
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          merge_deploy_mode: "true"
          environment: "production"
          permissions: "write,admin"

      - name: Assert merge_deploy_mode ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONTINUE: ${{ steps.action.outputs.continue }}
          ENVIRONMENT: ${{ steps.action.outputs.environment }}
          DECISION: ${{ steps.action.outputs.decision }}
          REASON_CODE: ${{ steps.action.outputs.reason_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "continue: $CONTINUE"
          echo "environment: $ENVIRONMENT"
          echo "decision: $DECISION"
          echo "reason_code: $REASON_CODE"
          if [ "$OUTCOME" = "success" ]; then
            # In merge_deploy_mode, the action makes API calls to the repo.
            # If it succeeds, continue and environment should be set.
            if [ -z "$CONTINUE" ] && [ -z "$ENVIRONMENT" ]; then
              echo "FAIL: action succeeded but both continue and environment outputs are empty"
              exit 1
            fi
            echo "PASS: merge_deploy_mode succeeded with continue=$CONTINUE environment=$ENVIRONMENT"
          elif [ "$OUTCOME" = "failure" ]; then
            # The sentinel repo is not resolvable, so the action may fail gracefully.
            echo "PASS: action failed gracefully (sentinel repo not resolvable for merge_deploy_mode)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
