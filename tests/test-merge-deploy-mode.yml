name: Test branch-deploy merge-deploy-mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock pull_request merged event payload
        run: |
          mkdir -p /tmp/github-events
          cat > /tmp/github-events/event.json <<'EOF'
          {
            "action": "closed",
            "pull_request": {
              "number": 42,
              "merged": true,
              "merge_commit_sha": "abc1234567890abcdef1234567890abcdef12345",
              "base": {
                "ref": "main",
                "sha": "def1234567890abcdef1234567890abcdef12345"
              },
              "head": {
                "ref": "feature-branch",
                "sha": "abc1234567890abcdef1234567890abcdef12345"
              },
              "user": {
                "login": "testuser"
              }
            },
            "repository": {
              "name": "test-repo",
              "owner": {
                "login": "test-owner"
              },
              "default_branch": "main"
            },
            "sender": {
              "login": "testuser"
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/github-events/event.json" >> $GITHUB_ENV

      - id: branch-deploy
        uses: .
        with:
          github_token: ${{ github.token }}
          merge_deploy_mode: "true"
          environment: "production"
          permissions: "write,admin"
        continue-on-error: true

      - name: Assert merge_deploy_mode handled gracefully
        env:
          OUTCOME: ${{ steps.branch-deploy.outcome }}
          TRIGGERED: ${{ steps.branch-deploy.outputs.triggered }}
        run: |
          echo "outcome: $OUTCOME"
          echo "triggered: $TRIGGERED"
          # In merge_deploy_mode, the action processes merge events
          # Under act without real GitHub API, it may fail or succeed with continue=false
          # We just verify the action ran (not skipped) and didn't produce triggered=true unexpectedly
          if [ "$TRIGGERED" = "true" ]; then
            echo "FAIL: triggered should not be 'true' in merge_deploy_mode without a real deployment"
            exit 1
          fi
          echo "PASS: merge_deploy_mode handled gracefully (outcome=$OUTCOME, triggered=$TRIGGERED)"
