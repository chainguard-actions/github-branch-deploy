name: Test branch-deploy enforced deployment order and draft targets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issue_comment
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          trigger: ".deploy"
          environment: "production"
          environment_targets: "development,staging,production"
          permissions: "write,admin"
          enforced_deployment_order: "development,staging,production"
          draft_permitted_targets: "development,staging"
          allow_non_default_target_branch_deployments: "false"
          production_environments: "production"
        continue-on-error: true

      - name: Assert deployment order options accepted gracefully
        env:
          TRIGGERED: ${{ steps.action.outputs.triggered }}
          NEEDS_DEPLOYED: ${{ steps.action.outputs.needs_to_be_deployed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "triggered: $TRIGGERED"
          echo "needs_to_be_deployed: $NEEDS_DEPLOYED"
          echo "outcome: $OUTCOME"
          # The action should accept enforced_deployment_order options.
          # Without a real GitHub context, it may error gracefully.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with triggered=$TRIGGERED"
          else
            echo "PASS: action exited with expected error (no real GitHub context in act)"
          fi
