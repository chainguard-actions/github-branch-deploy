name: Test branch-deploy deploy to specific environment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issue_comment
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock issue_comment event with deploy-to-environment trigger
        run: |
          mkdir -p /tmp/github-events
          cat > /tmp/github-events/event.json <<'EOF'
          {
            "action": "created",
            "issue": {
              "number": 15,
              "pull_request": {
                "url": "https://api.github.com/repos/test-owner/test-repo/pulls/15"
              }
            },
            "comment": {
              "id": 333444,
              "body": ".deploy to development",
              "user": {
                "login": "devdeployer"
              }
            },
            "repository": {
              "name": "test-repo",
              "owner": {
                "login": "test-owner"
              },
              "default_branch": "main"
            },
            "sender": {
              "login": "devdeployer"
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/github-events/event.json" >> $GITHUB_ENV

      - id: branch-deploy
        uses: .
        with:
          github_token: ${{ github.token }}
          trigger: ".deploy"
          noop_trigger: ".noop"
          environment: "production"
          environment_targets: "production,development,staging"
          permissions: "write,admin"
          update_branch: "disabled"
          skip_ci: "development,staging"
          skip_reviews: "development,staging"
        continue-on-error: true

      - name: Assert deploy-to-environment detected or action handled gracefully
        env:
          OUTCOME: ${{ steps.branch-deploy.outcome }}
          TRIGGERED: ${{ steps.branch-deploy.outputs.triggered }}
          ENVIRONMENT: ${{ steps.branch-deploy.outputs.environment }}
          NOOP: ${{ steps.branch-deploy.outputs.noop }}
        run: |
          echo "outcome: $OUTCOME"
          echo "triggered: $TRIGGERED"
          echo "environment: $ENVIRONMENT"
          echo "noop: $NOOP"
          # If the action succeeded and detected the trigger, environment should be "development"
          if [ "$OUTCOME" = "success" ] && [ "$TRIGGERED" = "true" ]; then
            if [ "$ENVIRONMENT" != "development" ]; then
              echo "FAIL: expected environment=development for '.deploy to development', got '$ENVIRONMENT'"
              exit 1
            fi
            if [ "$NOOP" = "true" ]; then
              echo "FAIL: expected noop=false for .deploy trigger, got 'true'"
              exit 1
            fi
            echo "PASS: deploy-to-environment correctly detected (environment=$ENVIRONMENT, noop=$NOOP)"
          else
            echo "PASS: action handled gracefully (outcome=$OUTCOME, triggered=$TRIGGERED) - likely API limitation in act"
          fi
