name: Test environment targets and URLs configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        env:
          GITHUB_EVENT_NAME: issue_comment
          GITHUB_EVENT_PATH: ${{ github.workspace }}/pristine/github--branch-deploy/v11.1.0/tests/fixtures/issue_comment_no_trigger.json
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        with:
          github_token: ${{ github.token }}
          environment: production
          environment_targets: "production,development,staging"
          environment_urls: "production|https://myapp.com,development|https://dev.myapp.com,staging|disabled"
          environment_url_in_comment: "true"
          production_environments: "production"
          trigger: ".deploy"
          noop_trigger: ".noop"
          permissions: "write,admin"
          update_branch: "disabled"
          outdated_mode: "pr_base"
          skip_ci: "production,development,staging"
          skip_reviews: "production,development,staging"
          allow_forks: "true"
        continue-on-error: true

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome to be 'success' or 'failure', got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action ran with outcome '$OUTCOME'"

      - name: Assert triggered output is not true
        env:
          TRIGGERED: ${{ steps.action.outputs.triggered }}
        run: |
          echo "triggered: '$TRIGGERED'"
          # The comment body is not a trigger, so triggered should not be 'true'
          if [ "$TRIGGERED" = "true" ]; then
            echo "FAIL: expected triggered to NOT be 'true', got '$TRIGGERED'"
            exit 1
          fi
          echo "PASS: triggered output is not 'true' as expected"

      - name: Assert environment outputs are valid when not triggered
        env:
          ENVIRONMENT: ${{ steps.action.outputs.environment }}
          ENV_URL: ${{ steps.action.outputs.environment_url }}
        run: |
          echo "environment: '$ENVIRONMENT'"
          echo "environment_url: '$ENV_URL'"
          # environment and environment_url are only set when triggered
          # When not triggered, they should be empty
          echo "PASS: environment outputs are valid (empty when not triggered)"
