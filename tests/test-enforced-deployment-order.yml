name: Test enforced deployment order
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          environment: production
          environment_targets: "development,staging,production"
          enforced_deployment_order: "development,staging,production"
          permissions: "write,admin"
        continue-on-error: true

      - name: Assert action completed with enforced deployment order
        env:
          TRIGGERED: ${{ steps.action.outputs.triggered }}
          NEEDS_DEPLOYED: ${{ steps.action.outputs.needs_to_be_deployed }}
        run: |
          echo "triggered: $TRIGGERED"
          echo "needs_to_be_deployed: $NEEDS_DEPLOYED"
          # With no PR comment context, triggered should be false or empty
          if [ "$TRIGGERED" = "true" ]; then
            echo "FAIL: expected triggered to be false or empty"
            exit 1
          fi
          echo "PASS: enforced deployment order configuration accepted"
