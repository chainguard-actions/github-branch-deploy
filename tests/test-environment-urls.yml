name: Test branch-deploy environment URLs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issue_comment
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          trigger: ".deploy"
          environment: "production"
          environment_targets: "production,development,staging"
          environment_urls: "production|https://myapp.com,development|https://dev.myapp.com,staging|disabled"
          environment_url_in_comment: "true"
          production_environments: "production"
          permissions: "write,admin"
        continue-on-error: true

      - name: Assert environment URLs configuration accepted
        env:
          ENV_URL: ${{ steps.action.outputs.environment_url }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "environment_url: $ENV_URL"
          echo "outcome: $OUTCOME"
          # The action should accept environment URL mappings.
          # Without a real GitHub context, it may error gracefully.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with environment_url=$ENV_URL"
          else
            echo "PASS: action exited with expected error (no real GitHub context in act)"
          fi
