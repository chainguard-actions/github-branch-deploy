name: Test custom trigger configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run branch-deploy action with custom triggers and environments
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          trigger: ".ship"
          noop_trigger: ".dry-run"
          lock_trigger: ".lock-env"
          unlock_trigger: ".unlock-env"
          help_trigger: ".help"
          environment: "staging"
          environment_targets: "staging,production"
          environment_urls: "staging|https://staging.example.com,production|https://example.com"
          permissions: "write,admin"
          stable_branch: "main"
          update_branch: "warn"
          reaction: "rocket"

      - name: Assert custom trigger action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TRIGGERED: ${{ steps.action.outputs.triggered }}
          DECISION: ${{ steps.action.outputs.decision }}
          REASON_CODE: ${{ steps.action.outputs.reason_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "triggered: $TRIGGERED"
          echo "decision: $DECISION"
          echo "reason_code: $REASON_CODE"
          if [ "$OUTCOME" = "success" ]; then
            # Under workflow_dispatch, the action exits safely (unsupported_event).
            # triggered is never set; decision='stop'; reason_code='unsupported_event'
            if [ "$DECISION" != "stop" ]; then
              echo "FAIL: expected decision='stop' but got '$DECISION'"
              exit 1
            fi
            if [ "$REASON_CODE" != "unsupported_event" ]; then
              echo "FAIL: expected reason_code='unsupported_event' but got '$REASON_CODE'"
              exit 1
            fi
            echo "PASS: action exited safely with decision=$DECISION reason_code=$REASON_CODE"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
