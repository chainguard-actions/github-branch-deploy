name: Test custom trigger inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run branch-deploy action with custom triggers
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          trigger: ".ship"
          noop_trigger: ".dry-run"
          lock_trigger: ".lock-env"
          unlock_trigger: ".unlock-env"
          help_trigger: ".help-me"
          environment: "staging"
          environment_targets: "staging,production"
          permissions: "write,admin"
          reaction: "rocket"
          param_separator: ":"
        continue-on-error: true

      - name: Assert action handled custom triggers gracefully
        env:
          TRIGGERED: ${{ steps.action.outputs.triggered }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "triggered: $TRIGGERED"
          echo "outcome: $OUTCOME"
          # Under workflow_dispatch with no issue comment, triggered should be false.
          # The action should accept custom trigger inputs without error.
          if [ "$TRIGGERED" = "true" ]; then
            echo "FAIL: triggered should not be 'true' with custom triggers under workflow_dispatch"
            exit 1
          fi
          echo "PASS: custom triggers accepted and no-trigger scenario handled correctly"
