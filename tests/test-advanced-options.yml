name: Test advanced options - skip_completing and sticky_locks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        env:
          GITHUB_EVENT_NAME: issue_comment
          GITHUB_EVENT_PATH: ${{ github.workspace }}/pristine/github--branch-deploy/v11.1.0/tests/fixtures/issue_comment_no_trigger.json
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        with:
          github_token: ${{ github.token }}
          environment: production
          environment_targets: "production,development,staging"
          trigger: ".deploy"
          noop_trigger: ".noop"
          permissions: "write,admin"
          update_branch: "disabled"
          outdated_mode: "pr_base"
          skip_ci: "production,development,staging"
          skip_reviews: "production,development,staging"
          allow_forks: "true"
          skip_completing: "false"
          sticky_locks: "false"
          sticky_locks_for_noop: "false"
          allow_sha_deployments: "false"
          disable_naked_commands: "false"
          commit_verification: "false"
          use_security_warnings: "true"
          allow_non_default_target_branch_deployments: "false"
          deployment_confirmation: "false"
        continue-on-error: true

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome to be 'success' or 'failure', got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action ran with outcome '$OUTCOME'"

      - name: Assert triggered output is not true
        env:
          TRIGGERED: ${{ steps.action.outputs.triggered }}
        run: |
          echo "triggered: '$TRIGGERED'"
          # The comment body is not a trigger, so triggered should not be 'true'
          if [ "$TRIGGERED" = "true" ]; then
            echo "FAIL: expected triggered to NOT be 'true', got '$TRIGGERED'"
            exit 1
          fi
          echo "PASS: triggered output is not 'true' as expected"

      - name: Assert fork-related outputs are valid
        env:
          FORK: ${{ steps.action.outputs.fork }}
        run: |
          echo "fork: '$FORK'"
          # fork is only set when triggered; should be empty or valid value
          if [ -n "$FORK" ] && [ "$FORK" != "true" ] && [ "$FORK" != "false" ]; then
            echo "FAIL: expected fork to be 'true', 'false', or empty, got '$FORK'"
            exit 1
          fi
          echo "PASS: fork output is valid"
